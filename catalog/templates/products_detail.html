{% extends 'base.html' %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="col">
                    <div class="card shadow-sm">
                        <img src="{{ product.image.url }}">
                        <div class="card-body">
                            <p class="card-text">Название: {{ product.name }}</p>
                            <p class="card-text">Категория: {{ product.category }}</p>
                            <p class="card-text">Описание: {{ product.description }}</p>
                            <p class="card-text">Цена: {{ product.price }} руб.</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a href="{% url 'catalog:products_list' %}" class="btn btn-sm btn-outline-secondary">Назад</a>
                                </div>
                                <small class="text-body-secondary">Дата изменения: {{ product.update_at|date:"d M Y" }}</small></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
