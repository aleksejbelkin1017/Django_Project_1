{% extends 'catalog/base.html' %}

{% block content %}
<h1>Изменение продукта</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить изменения</button>
</form>

<a href="{% url 'catalog:products_list' %}">Отмена</a>
{% endblock %}
