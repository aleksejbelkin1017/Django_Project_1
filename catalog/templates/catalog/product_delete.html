{% extends 'catalog/base.html' %}

{% block content %}
<h1>Удаление записи</h1>

<p>Вы уверены, что хотите удалить запись "{{ object.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
</form>

<a href="{% url 'catalog:products_list' %}">Отмена</a>
{% endblock %}
