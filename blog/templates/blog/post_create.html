{% extends 'blog/base.html' %}

{% block content %}
<h1>Создание новой записи</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'blog:post_list' %}">Вернуться к списку</a>
{% endblock %}
