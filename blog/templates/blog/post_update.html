{% extends 'blog/base.html' %}

{% block content %}
<h1>Редактирование записи</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить изменения</button>
</form>

<a href="{% url 'blog:post_detail' post.pk %}">Отмена</a>
{% endblock %}
