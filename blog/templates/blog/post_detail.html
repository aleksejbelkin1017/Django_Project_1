{% extends 'blog/base.html' %}

{% block content %}
<h1>{{ post.title }}</h1>

{% if post.preview %}
    <img src="{{ post.preview.url }}" alt="Превью" style="width: 300px;">
{% endif %}

<p>{{ post.content }}</p>
<p>Дата создания: {{ post.created_at }}</p>
<p>Просмотры: {{ post.views_count }}</p>
<p>Опубликовано: {{ post.is_published }}</p>

<a href="{% url 'blog:post_update' post.pk %}">Редактировать</a>
<a href="{% url 'blog:post_delete' post.pk %}">Удалить</a>
<a href="{% url 'blog:post_list' %}">Вернуться к списку</a>
{% endblock %}
